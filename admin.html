<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка — iSakha</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #08080a;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    color: #fff;
    min-height: 100vh;
  }

  /* ===== ЭКРАН ВХОДА ===== */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  .login-screen::before {
    content: "";
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(122, 42, 56, 0.5), transparent 65%);
    filter: blur(80px);
    pointer-events: none;
  }

  .login-card {
    position: relative;
    z-index: 1;
    background: #101014;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 28px;
    padding: 48px 40px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 40px 100px rgba(0,0,0,0.7);
  }

  .login-logo {
    font-size: 26px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    justify-content: center;
  }

  .login-logo svg { width: 24px; height: 28px; fill: #7a2a38; }

  .login-sub {
    text-align: center;
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 36px;
  }

  .form-group { margin-bottom: 18px; }

  .form-label {
    display: block;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    font-weight: 600;
    margin-bottom: 8px;
  }

  .form-input {
    width: 100%;
    padding: 14px 18px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: all 0.2s;
  }

  .form-input:focus {
    border-color: rgba(212, 107, 124, 0.6);
    background: rgba(255,255,255,0.06);
    box-shadow: 0 0 0 3px rgba(122, 42, 56, 0.2);
  }

  .btn-login {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #7a2a38, #4a1520);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    box-shadow: 0 12px 36px rgba(122, 42, 56, 0.5);
    margin-top: 8px;
  }

  .btn-login:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 16px 48px rgba(122, 42, 56, 0.7);
  }

  .btn-login:disabled { opacity: 0.5; cursor: wait; }

  .error-msg {
    background: rgba(255, 90, 90, 0.1);
    border: 1px solid rgba(255, 90, 90, 0.3);
    color: #ff8080;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    margin-top: 14px;
    display: none;
  }

  .error-msg.show { display: block; }

  /* ===== АДМИНКА ===== */
  .admin-wrap {
    display: none;
    min-height: 100vh;
  }

  .admin-wrap.show { display: block; }

  /* Шапка админки */
  .admin-header {
    background: rgba(8, 8, 10, 0.9);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding: 18px 40px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .admin-header-inner {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .admin-logo {
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .admin-logo svg { width: 20px; height: 24px; fill: #7a2a38; }

  .admin-user {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13px;
    color: rgba(255,255,255,0.5);
  }

  .btn-logout {
    padding: 8px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }

  .btn-logout:hover {
    background: rgba(255, 90, 90, 0.1);
    border-color: rgba(255, 90, 90, 0.4);
    color: #ff8080;
  }

  /* Вкладки */
  .admin-tabs {
    max-width: 1280px;
    margin: 0 auto;
    padding: 30px 40px 0;
    display: flex;
    gap: 8px;
  }

  .tab-btn {
    padding: 12px 24px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }

  .tab-btn:hover {
    background: rgba(255,255,255,0.05);
    color: #fff;
  }

  .tab-btn.active {
    background: linear-gradient(135deg, #7a2a38, #4a1520);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 8px 24px rgba(122, 42, 56, 0.4);
  }

  /* Контент */
  .admin-content {
    max-width: 1280px;
    margin: 0 auto;
    padding: 30px 40px 80px;
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Кнопка добавить */
  .add-btn {
    padding: 14px 24px;
    background: linear-gradient(135deg, #7a2a38, #4a1520);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
    box-shadow: 0 8px 24px rgba(122, 42, 56, 0.4);
    margin-bottom: 24px;
  }

  .add-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(122, 42, 56, 0.6);
  }

  /* Пусто */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    background: #101014;
    border: 1px dashed rgba(255,255,255,0.1);
    border-radius: 20px;
    color: rgba(255,255,255,0.4);
    font-size: 15px;
  }

  /* Карточка товара в админке */
  .admin-products {
    display: grid;
    gap: 14px;
  }

  .admin-product {
    display: grid;
    grid-template-columns: 80px 1fr auto auto;
    gap: 20px;
    align-items: center;
    padding: 18px;
    background: #101014;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 18px;
    transition: all 0.2s;
  }

  .admin-product:hover {
    border-color: rgba(180, 80, 100, 0.3);
  }

  .ap-thumb {
    width: 80px;
    height: 80px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    background: radial-gradient(circle, #2a1a24 0%, #0a0a0c 100%);
  }

  .ap-thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .ap-info { min-width: 0; }

  .ap-name {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .ap-spec {
    font-size: 13px;
    color: rgba(255,255,255,0.45);
  }

  .ap-price {
    font-size: 18px;
    font-weight: 700;
    white-space: nowrap;
  }

  .ap-actions {
    display: flex;
    gap: 8px;
  }

  .btn-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .btn-icon:hover {
    background: rgba(255,255,255,0.1);
    color: #fff;
  }

  .btn-icon.danger:hover {
    background: rgba(255, 90, 90, 0.15);
    border-color: rgba(255, 90, 90, 0.4);
    color: #ff8080;
  }

  .btn-icon svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Заказы */
  .admin-orders {
    display: grid;
    gap: 14px;
  }

  .order-card {
    padding: 22px;
    background: #101014;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 18px;
    transition: all 0.2s;
  }

  .order-card:hover {
    border-color: rgba(180, 80, 100, 0.3);
  }

  .order-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-wrap: wrap;
  }

  .order-date {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .order-name {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .order-contact {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
  }

  .order-total {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #d46b7c;
    white-space: nowrap;
  }

  .order-items {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .order-item {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 14px;
    padding: 8px 0;
  }

  .order-item-name { color: rgba(255,255,255,0.8); }
  .order-item-spec { color: rgba(255,255,255,0.4); font-size: 12px; margin-top: 2px; }
  .order-item-price { color: #fff; font-weight: 600; white-space: nowrap; }

  .order-address {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 13px;
    color: rgba(255,255,255,0.5);
  }

  .order-comment {
    margin-top: 10px;
    padding: 10px 14px;
    background: rgba(122, 42, 56, 0.15);
    border-left: 3px solid #7a2a38;
    border-radius: 6px;
    font-size: 13px;
    color: rgba(255,255,255,0.7);
  }

  /* Модалка */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(8px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-y: auto;
  }

  .modal-overlay.show {
    display: flex;
  }

  .modal-box {
    background: #101014;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 36px 32px;
    max-width: 540px;
    width: 100%;
    margin: auto;
  }

  .modal-box h3 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 24px;
    letter-spacing: -0.5px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }

  .btn-cancel {
    flex: 1;
    padding: 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    color: rgba(255,255,255,0.8);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-cancel:hover {
    background: rgba(255,255,255,0.1);
  }

  .btn-save {
    flex: 1;
    padding: 14px;
    background: linear-gradient(135deg, #7a2a38, #4a1520);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 8px 24px rgba(122, 42, 56, 0.4);
  }

  .btn-save:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 32px rgba(122, 42, 56, 0.6);
  }

  .btn-save:disabled { opacity: 0.5; cursor: wait; }

  /* Адаптив */
  @media (max-width: 700px) {
    .admin-header { padding: 14px 20px; }
    .admin-tabs { padding: 20px 20px 0; flex-wrap: wrap; }
    .admin-content { padding: 20px 20px 60px; }
    .admin-product {
      grid-template-columns: 60px 1fr;
      gap: 14px;
      padding: 14px;
    }
    .ap-thumb { width: 60px; height: 60px; }
    .ap-price { font-size: 15px; grid-column: 2; }
    .ap-actions { grid-column: 2; }
    .form-row { grid-template-columns: 1fr; }
    .order-total { font-size: 18px; }
  }
</style>
</head>

  <!-- ЭКРАН ВХОДА -->
  <div class="login-screen" id="loginScreen">

        iSakha
      </div>
      <div class="login-sub">Админ-панель</div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="loginEmail" placeholder="admin@isakha.ru" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button class="btn-login" id="btnLogin">Войти</button>
      <div class="error-msg" id="loginError"></div>

  </div>

  <!-- АДМИНКА -->
  <div class="admin-wrap" id="adminWrap">

    <div class="admin-header">
      <div class="admin-header-inner">
        <div class="admin-logo">
          <svg viewBox="0 0 24 30"><path d="M17.05 15.6c-.03-3.2 2.6-4.73 2.72-4.8-1.48-2.17-3.79-2.47-4.6-2.5-1.96-.2-3.82 1.15-4.82 1.15-1 0-2.53-1.12-4.16-1.09-2.14.03-4.11 1.25-5.21 3.16-2.22 3.85-.57 9.55 1.6 12.68 1.06 1.53 2.32 3.25 3.97 3.19 1.6-.07 2.2-1.03 4.13-1.03 1.93 0 2.47 1.03 4.16.99 1.72-.03 2.8-1.56 3.85-3.1 1.21-1.78 1.71-3.5 1.74-3.59-.04-.02-3.34-1.28-3.38-5.06zM14.03 6.4c.88-1.07 1.47-2.55 1.31-4.03-1.27.05-2.8.84-3.71 1.91-.81.94-1.53 2.45-1.34 3.9 1.42.11 2.86-.72 3.74-1.78z"/></svg>
          iSakha · Админка
        </div>
        <div class="admin-user">
          <span id="userEmail"></span>
          <button class="btn-logout" id="btnLogout">Выйти</button>
        </div>
      </div>
    </div>

    <div class="admin-tabs">
      <button class="tab-btn active" data-tab="orders">Заказы</button>
      <button class="tab-btn" data-tab="products">Товары</button>
    </div>

    <div class="admin-content">

      <!-- ВКЛАДКА ЗАКАЗЫ -->
      <div class="tab-content active" id="tab-orders">
        <div id="ordersList"></div>
      </div>

      <!-- ВКЛАДКА ТОВАРЫ -->
      <div class="tab-content" id="tab-products">
        <button class="add-btn" id="btnAddProduct">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Добавить товар
        </button>
        <div id="productsList"></div>
      </div>

    </div>
  </div>

  <!-- МОДАЛКА ТОВАРА -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-box">
      <h3 id="modalTitle">Новый товар</h3>

      <div class="form-group">
        <label class="form-label">Название</label>
        <input type="text" class="form-input" id="pName" placeholder="iPhone 18 Pro Max">
      </div>

      <div class="form-group">
        <label class="form-label">Цвет (ключ)</label>
        <input type="text" class="form-input" id="pColor" placeholder="burgundy / silver / glacier / black">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Название цвета</label>
          <input type="text" class="form-input" id="pColorName" placeholder="Burgundy">
        </div>
        <div class="form-group">
          <label class="form-label">Память</label>
          <input type="text" class="form-input" id="pStorage" placeholder="256 ГБ">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Цена (₽)</label>
        <input type="number" class="form-input" id="pPrice" placeholder="149990">
      </div>

      <div class="form-group">
        <label class="form-label">URL фото</label>
        <input type="text" class="form-input" id="pPhoto" placeholder="https://...">
      </div>

      <div class="form-group">
        <label class="form-label">URL 3D-модели (iframe src)</label>
        <input type="text" class="form-input" id="pModel" placeholder="https://sketchfab.com/models/.../embed?...">
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" id="btnCancel">Отмена</button>
        <button class="btn-save" id="btnSave">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    // ===== ЭЛЕМЕНТЫ =====
    const loginScreen = document.getElementById('loginScreen');
    const adminWrap = document.getElementById('adminWrap');
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const btnLogin = document.getElementById('btnLogin');
    const loginError = document.getElementById('loginError');
    const btnLogout = document.getElementById('btnLogout');
    const userEmail = document.getElementById('userEmail');

    // ===== ВХОД =====
    btnLogin.addEventListener('click', async () => {
      const email = loginEmail.value.trim();
      const password = loginPassword.value;

      if (!email || !password) {
        showError('Заполни email и пароль');
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = 'Вход...';
      loginError.classList.remove('show');

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (err) {
        console.error(err);
        let msg = 'Ошибка входа';
        if (err.code === 'auth/user-not-found') msg = 'Пользователь не найден';
        if (err.code === 'auth/wrong-password') msg = 'Неверный пароль';
        if (err.code === 'auth/invalid-email') msg = 'Неверный email';
        if (err.code === 'auth/invalid-credential') msg = 'Неверный email или пароль';
        if (err.code === 'auth/too-many-requests') msg = 'Слишком много попыток. Попробуй позже';
        showError(msg);
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = 'Войти';
      }
    });

    // Enter в полях
    [loginEmail, loginPassword].forEach(inp => {
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') btnLogin.click();
      });
    });

    function showError(msg) {
      loginError.textContent = msg;
      loginError.classList.add('show');
    }

    // ===== СОСТОЯНИЕ АВТОРИЗАЦИИ =====
    auth.onAuthStateChanged(user => {
      if (user) {
        loginScreen.style.display = 'none';
        adminWrap.classList.add('show');
        userEmail.textContent = user.email;
        loadProducts();
        loadOrders();
      } else {
        loginScreen.style.display = 'flex';
        adminWrap.classList.remove('show');
        loginPassword.value = '';
      }
    });

    // ===== ВЫХОД =====
    btnLogout.addEventListener('click', () => {
      auth.signOut();
    });

    // ===== ВКЛАДКИ =====
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    // ===== ТОВАРЫ =====
    let productsCache = {};
    let editingId = null;

    function loadProducts() {
      db.ref('products').on('value', snap => {
        productsCache = snap.val() || {};
        renderProducts();
      });
    }

    function renderProducts() {
      const list = document.getElementById('productsList');
      const items = Object.entries(productsCache);

      if (items.length === 0) {
        list.innerHTML = '<div class="empty-state">Пока нет товаров. Добавь первый!</div>';
        return;
      }

      list.innerHTML = `
        <div class="admin-products">
          ${items.map(([id, p]) => `
            <div class="admin-product">
              <div class="ap-thumb">
                ${p.photo ? `<img src="${p.photo}" alt="">` : ''}
              </div>
              <div class="ap-info">
                <div class="ap-name">${p.name || '—'}</div>
                <div class="ap-spec">${p.colorName || ''} · ${p.storage || ''}</div>
              </div>
              <div class="ap-price">${formatPrice(p.price || 0)}</div>
              <div class="ap-actions">
                <button class="btn-icon" onclick="editProduct('${id}')" title="Редактировать">
                  <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </button>
                <button class="btn-icon danger" onclick="deleteProduct('${id}')" title="Удалить">
                  <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
                </button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // Открыть модалку для нового
    document.getElementById('btnAddProduct').addEventListener('click', () => {
      editingId = null;
      document.getElementById('modalTitle').textContent = 'Новый товар';
      ['pName','pColor','pColorName','pStorage','pPrice','pPhoto','pModel'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('productModal').classList.add('show');
    });

    // Открыть для редактирования
    window.editProduct = (id) => {
      const p = productsCache[id];
      if (!p) return;
      editingId = id;
      document.getElementById('modalTitle').textContent = 'Редактировать товар';
      document.getElementById('pName').value = p.name || '';
      document.getElementById('pColor').value = p.color || '';
      document.getElementById('pColorName').value = p.colorName || '';
      document.getElementById('pStorage').value = p.storage || '';
      document.getElementById('pPrice').value = p.price || '';
      document.getElementById('pPhoto').value = p.photo || '';
      document.getElementById('pModel').value = p.model || '';
      document.getElementById('productModal').classList.add('show');
    };

    // Удалить
    window.deleteProduct = (id) => {
      if (!confirm('Удалить товар?')) return;
      db.ref('products/' + id).remove();
    };

    // Отмена
    document.getElementById('btnCancel').addEventListener('click', () => {
      document.getElementById('productModal').classList.remove('show');
    });

    // Сохранить
    document.getElementById('btnSave').addEventListener('click', async () => {
      const btn = document.getElementById('btnSave');
      const name = document.getElementById('pName').value.trim();
      const color = document.getElementById('pColor').value.trim();
      const colorName = document.getElementById('pColorName').value.trim();
      const storage = document.getElementById('pStorage').value.trim();
      const price = parseInt(document.getElementById('pPrice').value, 10) || 0;
      const photo = document.getElementById('pPhoto').value.trim();
      const model = document.getElementById('pModel').value.trim();

      if (!name) { alert('Введи название'); return; }

      btn.disabled = true;
      btn.textContent = 'Сохранение...';

      try {
        const data = { name, color, colorName, storage, price, photo, model };
        if (editingId) {
          await db.ref('products/' + editingId).update(data);
        } else {
          await db.ref('products').push(data);
        }
        document.getElementById('productModal').classList.remove('show');
      } catch (err) {
        console.error(err);
        alert('Ошибка: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Сохранить';
      }
    });

    // ===== ЗАКАЗЫ =====
    function loadOrders() {
      db.ref('orders').on('value', snap => {
        const orders = snap.val() || {};
        renderOrders(orders);
      });
    }

    function renderOrders(orders) {
      const list = document.getElementById('ordersList');
      const items = Object.entries(orders).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

      if (items.length === 0) {
        list.innerHTML = '<div class="empty-state">Заказов пока нет</div>';
        return;
      }

      list.innerHTML = `
        <div class="admin-orders">
          ${items.map(([id, o]) => `
            <div class="order-card">
              <div class="order-head">
                <div>
                  <div class="order-date">${formatDate(o.createdAt)}</div>
                  <div class="order-name">${o.name || '—'}</div>
                  <div class="order-contact">${o.phone || ''}</div>
                </div>
                <div class="order-total">${formatPrice(o.total || 0)}</div>
              </div>

              <div class="order-items">
                ${(o.items || []).map(it => `
                  <div class="order-item">
                    <div>
                      <div class="order-item-name">${it.name || ''}</div>
                      <div class="order-item-spec">${it.colorName || ''} · ${it.storage || ''} · ${it.sim || ''}</div>
                    </div>
                    <div class="order-item-price">${formatPrice(it.price || 0)}</div>
                  </div>
                `).join('')}
              </div>

              ${o.address ? `<div class="order-address">📍 ${o.address}</div>` : ''}
              ${o.comment ? `<div class="order-comment">💬 ${o.comment}</div>` : ''}
            </div>
          `).join('')}
        </div>
      `;
    }

    // ===== УТИЛИТЫ =====
    function formatPrice(n) {
      return (n || 0).toLocaleString('ru-RU') + ' ₽';
    }

    function formatDate(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      const pad = n => String(n).padStart(2, '0');
      return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
  </script>
</body>
</html>
